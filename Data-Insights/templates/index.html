<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Look E-commerce Data Insights</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <div class="container">

    <!-- Main Title -->
    <h1>Look E-commerce Data Insights</h1>

    <!-- Dropdown + Run Button -->
    <form method="post" class="query-form">
      <select name="query" required>
        <option value="" disabled selected>Select a query</option>
        <option value="top_products">Top 10 Products by Profit</option>
        <option value="top_centers">Top 10 Distribution Centers by Units Sold</option>
      </select>

      <button type="submit">Run Query</button>
    </form>

    <!-- Selected Query Heading -->
    {% if heading %}
      <h2>{{ heading }}</h2>
    {% endif %}

    <!-- Results -->
    {% if columns and rows %}
      <table>
        <thead>
          <tr>
            {% for col in columns %}
              <th>{{ col }}</th>
            {% endfor %}
          </tr>
        </thead>

        <tbody>
          {% for row in rows %}
            <tr>
              {% for cell in row %}
                <td>{{ cell }}</td>
              {% endfor %}
            </tr>
          {% endfor %}
        </tbody>
      </table>

    {% elif error %}
      <p class="error">{{ error }}</p>
    {% endif %}

  </div>

</body>
</html>
